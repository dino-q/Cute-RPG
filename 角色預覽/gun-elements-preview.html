<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>槍手元素武器預覽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a18;color:#fff;font-family:'Nunito','Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:18px;color:#FFD43B;margin-bottom:12px}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:900px}
.cell{text-align:center}
.cell canvas{border:1px solid rgba(255,255,255,.06);border-radius:10px}
.label{font-size:11px;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<h1>槍手 — 元素武器變化預覽</h1>
<div class="grid">
  <div class="cell"><canvas id="c0" width="160" height="160"></canvas><div class="label" style="color:#ADB5BD">基礎手槍</div></div>
  <div class="cell"><canvas id="c1" width="160" height="160"></canvas><div class="label" style="color:#FF6B6B">🔥 熔岩槍</div></div>
  <div class="cell"><canvas id="c2" width="160" height="160"></canvas><div class="label" style="color:#66D9E8">❄️ 冰晶槍</div></div>
  <div class="cell"><canvas id="c3" width="160" height="160"></canvas><div class="label" style="color:#FAB005">⚡ 電磁槍</div></div>
  <div class="cell"><canvas id="c4" width="160" height="160"></canvas><div class="label" style="color:#A9E34B">🌿 酸蝕槍</div></div>
  <div class="cell"><canvas id="c5" width="160" height="160"></canvas><div class="label" style="color:#FF922B">🐉 龍骨重砲</div></div>
  <div class="cell"><canvas id="c6" width="160" height="160"></canvas><div class="label" style="color:#F06595">⭐ 能量步槍</div></div>
</div>

<script>
const PI=Math.PI,TAU=PI*2;

// 元素色票
const ELEM={
  none: {slide:"#3a3a3a",slideMid:"#4a4a4a",slideLight:"#5a5a5a",slideEdge:"#2a2a2a",frame:"#444",
         muzzle:"#74C0FC",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7",particleCol:"#74C0FC"},
  fire: {slide:"#5a2020",slideMid:"#8B3030",slideLight:"#C04040",slideEdge:"#3a1515",frame:"#6a2a2a",
         muzzle:"#FF4500",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7",particleCol:"#FF6B6B"},
  ice:  {slide:"#2a4a5a",slideMid:"#3a6a7a",slideLight:"#7ac4d8",slideEdge:"#1a3545",frame:"#2a5565",
         muzzle:"#66D9E8",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7",particleCol:"#66D9E8"},
  lightning:{slide:"#4a3a10",slideMid:"#6a5520",slideLight:"#c0a030",slideEdge:"#3a2a08",frame:"#5a4515",
         muzzle:"#FAB005",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7",particleCol:"#FAB005"},
  poison:{slide:"#1a3a1a",slideMid:"#2a5a2a",slideLight:"#5a9a3a",slideEdge:"#0a2a0a",frame:"#2a4a2a",
         muzzle:"#A9E34B",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7",particleCol:"#A9E34B"},
  dragon:{slide:"#4a2a10",slideMid:"#7a4a1a",slideLight:"#c08030",slideEdge:"#3a1a08",frame:"#5a3515",
         muzzle:"#FF922B",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7",particleCol:"#FF922B"},
  star:  {slide:"#3a1a3a",slideMid:"#5a2a5a",slideLight:"#a050a0",slideEdge:"#2a0a2a",frame:"#4a1a4a",
         muzzle:"#F06595",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7",particleCol:"#F06595"}
};

function drawElementGun(cx, e, t){
  // 滑套
  cx.fillStyle=e.slide;cx.fillRect(0,0,150,28);
  cx.fillStyle=e.slideLight;cx.fillRect(2,1,146,3);
  cx.fillStyle=e.slideMid;cx.fillRect(2,5,146,8);
  cx.fillStyle=e.slideEdge;cx.fillRect(0,25,150,3);
  // 鋸齒紋
  cx.fillStyle=e.slideEdge;
  for(let i=0;i<7;i++)cx.fillRect(8+i*6,4,2,20);
  for(let i=0;i<3;i++)cx.fillRect(110+i*6,6,2,16);
  // 退殼口
  cx.fillStyle=e.slideEdge;cx.fillRect(55,4,18,10);
  cx.fillStyle=e.slideMid;cx.fillRect(56,5,16,8);
  // 前準星（元素色）
  cx.fillStyle=e.muzzle;cx.globalAlpha=.8;cx.fillRect(140,-5,5,6);cx.globalAlpha=1;
  cx.fillStyle="#fff";cx.globalAlpha=.5;cx.fillRect(141,-5,3,2);cx.globalAlpha=1;
  // 後準星
  cx.fillStyle=e.slideEdge;cx.fillRect(3,-4,4,5);cx.fillRect(13,-4,4,5);
  cx.fillStyle=e.slide;cx.fillRect(7,-3,6,4);
  // 下機匣
  cx.fillStyle=e.frame;cx.fillRect(18,28,100,12);
  cx.fillStyle=e.slideEdge;cx.fillRect(55,36,40,4);
  // 扳機護圈
  cx.strokeStyle="#1a1a1a";cx.lineWidth=3;
  cx.beginPath();cx.moveTo(42,28);cx.lineTo(42,44);
  cx.arc(56,44,14,PI,0,false);cx.lineTo(70,28);cx.stroke();
  cx.fillStyle="rgba(30,30,30,.3)";cx.fill();
  // 扳機
  cx.strokeStyle="#555";cx.lineWidth=2.5;
  cx.beginPath();cx.moveTo(57,30);cx.lineTo(54,42);cx.stroke();
  cx.fillStyle="#555";cx.beginPath();cx.arc(54,43,2,0,TAU);cx.fill();
  // 握把
  cx.fillStyle="#1a1a1a";cx.beginPath();
  cx.moveTo(18,28);cx.lineTo(42,28);cx.lineTo(39,76);cx.lineTo(11,76);cx.closePath();cx.fill();
  cx.fillStyle="#2a2a2a";
  for(let row=0;row<6;row++)for(let col=0;col<3;col++){
    cx.fillRect(17+col*7+(row%2)*3,36+row*7,3,3);
  }
  cx.fillStyle="#353535";cx.beginPath();
  cx.moveTo(18,28);cx.lineTo(22,28);cx.lineTo(14,76);cx.lineTo(11,76);cx.closePath();cx.fill();
  // 彈匣底板
  cx.fillStyle="#2a2a2a";cx.fillRect(11,73,29,5);
  cx.fillStyle="#404040";cx.fillRect(12,74,27,2);
  // 槍口（元素色光環）
  cx.fillStyle="#111";cx.fillRect(148,6,4,18);
  cx.fillStyle="#000";cx.beginPath();cx.arc(150,15,5,0,TAU);cx.fill();
  const mp=.5+Math.sin(t*6)*.3;
  cx.strokeStyle=e.muzzle;cx.globalAlpha=mp*.5;cx.lineWidth=2;
  cx.beginPath();cx.arc(150,15,6.5,0,TAU);cx.stroke();cx.globalAlpha=1;
  cx.strokeStyle="#444";cx.lineWidth=1;cx.beginPath();cx.arc(150,15,5.5,0,TAU);cx.stroke();
  // 輪廓
  cx.strokeStyle="#1a1a1a";cx.lineWidth=2;cx.strokeRect(0,0,150,28);
  // 滑套元素紋路（發光線）
  cx.strokeStyle=e.muzzle;cx.lineWidth=.8;cx.globalAlpha=.2+Math.sin(t*3)*.1;
  cx.beginPath();cx.moveTo(50,14);cx.lineTo(135,14);cx.stroke();
  cx.globalAlpha=1;
  // 高光
  cx.fillStyle=e.slideLight;cx.globalAlpha=.3;
  cx.fillRect(30,2,40,2);cx.fillRect(90,2,30,2);
  cx.globalAlpha=1;
}

function drawScene(canvasId, elemKey){
  const cv=document.getElementById(canvasId);
  const cx=cv.getContext("2d");
  const W=cv.width,H=cv.height,centerX=W/2,baseY=H/2+10,r=18,f=1;
  const e=ELEM[elemKey];
  let t=0;

  function frame(){
    t+=.016;
    cx.clearRect(0,0,W,H);
    const bob=Math.sin(t*3)*1.5,cy=baseY+bob;
    const muzzleGlow=.3+Math.sin(t*8)*.15;

    // bg aura
    const bg=cx.createRadialGradient(centerX,baseY,0,centerX,baseY,70);
    bg.addColorStop(0,e.particleCol+"15");bg.addColorStop(1,"transparent");
    cx.fillStyle=bg;cx.fillRect(0,0,W,H);

    // shadow
    cx.fillStyle="rgba(0,0,0,.18)";
    cx.beginPath();cx.ellipse(centerX,baseY+r+3,r*.65,2.5,0,0,TAU);cx.fill();

    // body
    cx.save();
    const bodyGrad=cx.createRadialGradient(centerX-f*r*.1,cy-r*.3,r*.1,centerX,cy,r);
    bodyGrad.addColorStop(0,"#fff");
    bodyGrad.addColorStop(.25,e.bodyMid);
    bodyGrad.addColorStop(.7,e.bodyCol);
    bodyGrad.addColorStop(1,e.bodyDark);
    cx.beginPath();cx.arc(centerX,cy,r,0,TAU);cx.fillStyle=bodyGrad;cx.fill();
    cx.strokeStyle="rgba(255,255,255,.12)";cx.lineWidth=1;cx.stroke();
    cx.restore();

    // gun
    cx.save();
    cx.translate(centerX+f*r*.45,cy+r*.05);
    cx.rotate(Math.sin(t*5)*.025);
    cx.scale(.11,.11);
    drawElementGun(cx, e, t);
    cx.restore();

    // muzzle glow
    cx.save();
    const mzX=centerX+f*r*.45+150*.11, mzY=cy+r*.05+1.5;
    cx.fillStyle=e.muzzle;cx.globalAlpha=muzzleGlow;
    cx.beginPath();cx.arc(mzX,mzY,2,0,TAU);cx.fill();
    cx.globalAlpha=muzzleGlow*.3;
    cx.beginPath();cx.arc(mzX,mzY,4,0,TAU);cx.fill();
    cx.restore();

    // element particles
    for(let i=0;i<3;i++){
      const a=t*2+i*TAU/3;
      const dist=26+Math.sin(t*2+i*2)*4;
      const px=centerX+Math.cos(a)*dist, py=cy+Math.sin(a)*dist;
      cx.save();
      cx.globalAlpha=.2+Math.sin(t*3+i)*.1;
      cx.shadowColor=e.particleCol;cx.shadowBlur=5;
      cx.fillStyle=e.particleCol;
      cx.beginPath();cx.arc(px,py,1.3+Math.sin(t*4+i)*.4,0,TAU);cx.fill();
      cx.restore();
    }

    // element-specific extra effects
    if(elemKey==="fire"){
      // fire sparks rising from gun
      for(let i=0;i<2;i++){
        const sx=mzX-3+Math.sin(t*5+i*3)*4;
        const sy=mzY-5-((t*30+i*15)%20);
        cx.save();cx.globalAlpha=.4-((t*30+i*15)%20)*.02;
        cx.fillStyle=i%2?"#FF6B6B":"#FFD43B";
        cx.beginPath();cx.arc(sx,sy,1,0,TAU);cx.fill();
        cx.restore();
      }
    }
    if(elemKey==="ice"){
      // frost shimmer
      cx.save();cx.globalAlpha=.08+Math.sin(t*2)*.04;
      cx.strokeStyle="#66D9E8";cx.lineWidth=1;
      cx.beginPath();cx.arc(centerX,cy,r+5,0,TAU);cx.stroke();
      cx.restore();
    }
    if(elemKey==="lightning"){
      // small lightning arc near muzzle
      if(Math.sin(t*8)>.6){
        cx.save();cx.strokeStyle="#FAB005";cx.lineWidth=.8;cx.globalAlpha=.6;
        cx.beginPath();cx.moveTo(mzX+2,mzY-3);
        cx.lineTo(mzX+5,mzY-1);cx.lineTo(mzX+3,mzY+2);cx.lineTo(mzX+6,mzY+4);
        cx.stroke();cx.restore();
      }
    }
    if(elemKey==="poison"){
      // drip from muzzle
      const dripY=mzY+3+((t*20)%12);
      const dripA=.5-((t*20)%12)*.04;
      cx.save();cx.globalAlpha=Math.max(0,dripA);
      cx.fillStyle="#A9E34B";
      cx.beginPath();cx.arc(mzX,dripY,1.2,0,TAU);cx.fill();
      cx.restore();
    }
    if(elemKey==="dragon"){
      // heat distortion ring
      cx.save();cx.globalAlpha=.1+Math.sin(t*3)*.05;
      cx.strokeStyle="#FF922B";cx.lineWidth=1.5;
      cx.beginPath();cx.arc(mzX,mzY,6+Math.sin(t*4)*2,0,TAU);cx.stroke();
      cx.restore();
    }
    if(elemKey==="star"){
      // star sparkles
      for(let i=0;i<2;i++){
        const sa=t*3+i*PI;
        const sd=20+Math.sin(t*2+i)*6;
        const spx=centerX+Math.cos(sa)*sd, spy=cy+Math.sin(sa)*sd;
        cx.save();cx.globalAlpha=.3+Math.sin(t*5+i)*.15;
        cx.fillStyle="#F06595";
        // 4-point star
        cx.beginPath();
        cx.moveTo(spx,spy-2.5);cx.lineTo(spx+1,spy);cx.lineTo(spx,spy+2.5);cx.lineTo(spx-1,spy);
        cx.closePath();cx.fill();
        cx.restore();
      }
    }

    requestAnimationFrame(frame);
  }
  frame();
}

drawScene("c0","none");
drawScene("c1","fire");
drawScene("c2","ice");
drawScene("c3","lightning");
drawScene("c4","poison");
drawScene("c5","dragon");
drawScene("c6","star");
</script>
</body>
</html>
