<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>槍手動畫預覽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a18;color:#fff;font-family:'Nunito','Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:18px;color:#74C0FC;margin-bottom:4px}
.sub{font-size:11px;color:rgba(255,255,255,.35);margin-bottom:16px}
.row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.col{text-align:center}
canvas{border:1px solid rgba(255,255,255,.06);border-radius:12px;cursor:pointer}
.label{font-size:12px;font-weight:700;margin-top:6px}
.hint{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
.controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;padding:6px 14px;font-size:11px;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.active{border-color:#74C0FC;color:#74C0FC}
.info{margin-top:12px;font-size:10px;color:rgba(255,255,255,.25);max-width:600px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<h1>🔫 槍手動畫預覽</h1>
<div class="sub">點擊角色觸發動作 / 下方切換動畫風格</div>
<div class="row">
  <div class="col">
    <canvas id="cv" width="300" height="300"></canvas>
    <div class="label" style="color:#74C0FC">艾拉 — 槍手</div>
    <div class="hint">點擊觸發動作</div>
  </div>
  <div class="col">
    <canvas id="cv2" width="300" height="300"></canvas>
    <div class="label" style="color:#74C0FC">連續動作（自動）</div>
    <div class="hint">每 1 秒自動觸發</div>
  </div>
</div>
<div class="controls">
  <button class="btn active" onclick="setStyle(0,this)">A. 連射</button>
  <button class="btn" onclick="setStyle(1,this)">B. 狙擊</button>
  <button class="btn" onclick="setStyle(3,this)">C. 彈幕掃射</button>
</div>
<div class="info">
  <b>A. 連射</b>：快速三連發，槍口火花 + 後座力<br>
  <b>B. 狙擊</b>：蓄力瞄準線 → 穿透射擊（大火花）<br>
  <b>C. 彈幕掃射</b>：扇形散射，大量子彈齊發
</div>

<script>
const PI=Math.PI,TAU=PI*2;
const cx1=document.getElementById("cv").getContext("2d");
const cx2=document.getElementById("cv2").getContext("2d");
const W=300,H=300,R=18;
let style=0,t=0;
let act1=0,actT1=0;
let act2=0,actT2=0,autoTimer=0;
// 子彈池
let bullets1=[],bullets2=[];

function setStyle(s,el){
  style=s;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  if(el)el.classList.add('active');
}
document.getElementById("cv").addEventListener("click",()=>{act1=1;actT1=0;});

const ELEM={
  slide:"#3a3a3a",slideMid:"#4a4a4a",slideLight:"#5a5a5a",slideEdge:"#2a2a2a",frame:"#444",
  muzzle:"#74C0FC",bodyCol:"#74C0FC",bodyMid:"#d4e8ff",bodyDark:"#4DABF7"
};

function drawGun(c,e,t,recoil){
  c.save();
  if(recoil)c.translate(-recoil*8,0);
  // 滑套
  c.fillStyle=e.slide;c.fillRect(0,0,150,28);
  c.fillStyle=e.slideLight;c.fillRect(2,1,146,3);
  c.fillStyle=e.slideMid;c.fillRect(2,5,146,8);
  c.fillStyle=e.slideEdge;c.fillRect(0,25,150,3);
  for(let i=0;i<7;i++)c.fillRect(8+i*6,4,2,20);
  for(let i=0;i<3;i++)c.fillRect(110+i*6,6,2,16);
  c.fillStyle=e.slideEdge;c.fillRect(55,4,18,10);c.fillStyle=e.slideMid;c.fillRect(56,5,16,8);
  c.fillStyle=e.muzzle;c.globalAlpha=.8;c.fillRect(140,-5,5,6);c.globalAlpha=1;
  c.fillStyle="#fff";c.globalAlpha=.5;c.fillRect(141,-5,3,2);c.globalAlpha=1;
  c.fillStyle=e.slideEdge;c.fillRect(3,-4,4,5);c.fillRect(13,-4,4,5);
  c.fillStyle=e.slide;c.fillRect(7,-3,6,4);
  c.fillStyle=e.frame;c.fillRect(18,28,100,12);
  c.fillStyle=e.slideEdge;c.fillRect(55,36,40,4);
  c.strokeStyle="#1a1a1a";c.lineWidth=3;
  c.beginPath();c.moveTo(42,28);c.lineTo(42,44);c.arc(56,44,14,PI,0,false);c.lineTo(70,28);c.stroke();
  c.fillStyle="rgba(30,30,30,.3)";c.fill();
  c.strokeStyle="#555";c.lineWidth=2.5;c.beginPath();c.moveTo(57,30);c.lineTo(54,42);c.stroke();
  c.fillStyle="#555";c.beginPath();c.arc(54,43,2,0,TAU);c.fill();
  c.fillStyle="#1a1a1a";c.beginPath();c.moveTo(18,28);c.lineTo(42,28);c.lineTo(39,76);c.lineTo(11,76);c.closePath();c.fill();
  c.fillStyle="#2a2a2a";for(let row=0;row<6;row++)for(let col=0;col<3;col++)c.fillRect(17+col*7+(row%2)*3,36+row*7,3,3);
  c.fillStyle="#111";c.fillRect(148,6,4,18);
  c.fillStyle="#000";c.beginPath();c.arc(150,15,5,0,TAU);c.fill();
  const mp=.5+Math.sin(t*6)*.3;
  c.strokeStyle=e.muzzle;c.globalAlpha=mp*.5;c.lineWidth=2;c.beginPath();c.arc(150,15,6.5,0,TAU);c.stroke();c.globalAlpha=1;
  c.strokeStyle="#1a1a1a";c.lineWidth=2;c.strokeRect(0,0,150,28);
  c.strokeStyle=e.muzzle;c.lineWidth=.8;c.globalAlpha=.2+Math.sin(t*3)*.1;
  c.beginPath();c.moveTo(50,14);c.lineTo(135,14);c.stroke();c.globalAlpha=1;
  c.restore();
}

function spawnBullets(arr,x,y,face,count,spread){
  const base=face>0?0:PI;
  for(let i=0;i<count;i++){
    const a=base+(i-(count-1)/2)*spread+(.5-Math.random())*.05;
    arr.push({x,y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,life:1});
  }
}

function drawGunner(c,x,y,time,face,act,actT,buls){
  const f=face||1,bob=Math.sin(time*3)*1.5,cy=y+bob;
  const p=act>0?Math.min(actT/.5,1):0;
  let bodyX=x,bodyAlpha=1,recoil=0;

  c.save();

  // bg aura
  const bg2=c.createRadialGradient(x,y,0,x,y,55);
  bg2.addColorStop(0,"rgba(116,192,252,.05)");bg2.addColorStop(1,"transparent");
  c.fillStyle=bg2;c.beginPath();c.arc(x,y,55,0,TAU);c.fill();

  // shadow
  c.fillStyle="rgba(0,0,0,.18)";c.beginPath();c.ellipse(x,y+R+3,R*.65,2.5,0,0,TAU);c.fill();

  // === Style C: 翻滾 — 身體位移 + 殘影 ===
  if(act>0&&style===2){
    const rollP=p;
    const rollDist=50;
    bodyX=x+f*rollP*rollDist*(rollP<.5?rollP/.5:1-(rollP-.5)/.5)*.7;
    bodyAlpha=.4+Math.abs(Math.sin(rollP*PI*3))*.6;
    // 殘影
    for(let i=0;i<3;i++){
      const gp=Math.max(0,rollP-i*.12);
      const gx=x+f*gp*rollDist*.5;
      c.save();c.globalAlpha=.15*(1-i*.3);
      const gg=c.createRadialGradient(gx,cy,0,gx,cy,R);
      gg.addColorStop(0,"#74C0FC");gg.addColorStop(1,"transparent");
      c.fillStyle=gg;c.beginPath();c.arc(gx,cy,R,0,TAU);c.fill();
      c.restore();
    }
  }

  // body
  c.save();
  c.globalAlpha=bodyAlpha;
  const bg=c.createRadialGradient(bodyX-f*R*.1,cy-R*.3,R*.1,bodyX,cy,R);
  bg.addColorStop(0,"#fff");bg.addColorStop(.25,"#d4e8ff");bg.addColorStop(.7,"#74C0FC");bg.addColorStop(1,"#4DABF7");
  c.beginPath();c.arc(bodyX,cy,R,0,TAU);c.fillStyle=bg;c.fill();
  c.strokeStyle="rgba(255,255,255,.12)";c.lineWidth=1;c.stroke();
  c.restore();

  // gun + action effects
  const mzX=bodyX+f*(R*.45+150*.11),mzY=cy+R*.05+1.5;

  if(act>0&&style===0){ // A. 連射：三連發 + 後座力
    const shotIdx=Math.floor(p*3); // 0,1,2
    const shotP=(p*3)%1;
    recoil=shotP<.3?shotP/.3:Math.max(0,1-(shotP-.3)/.7);
    // 槍口火花
    if(shotP<.3){
      c.save();c.globalAlpha=(1-shotP/.3)*.8;
      c.fillStyle="#FFE066";c.beginPath();c.arc(mzX+f*5,mzY,4+shotP*8,0,TAU);c.fill();
      c.fillStyle="#fff";c.beginPath();c.arc(mzX+f*3,mzY,2,0,TAU);c.fill();
      c.restore();
    }
    // 每發生成子彈
    if(actT>0&&actT<.5){
      const prevIdx=Math.floor((actT-1/60)*3/.5);
      if(prevIdx!==shotIdx&&shotIdx<3){
        spawnBullets(buls,mzX,mzY,f,1,0);
      }
    }
  }
  else if(act>0&&style===1){ // B. 狙擊：蓄力 → 射擊
    if(p<.6){ // 蓄力
      const chP=p/.6;
      // 瞄準線
      c.save();c.globalAlpha=chP*.6;c.strokeStyle="#FF4040";c.lineWidth=1;c.setLineDash([4,3]);
      c.beginPath();c.moveTo(mzX,mzY);c.lineTo(mzX+f*120*chP,mzY);c.stroke();c.setLineDash([]);
      // 蓄力圈
      c.strokeStyle="#74C0FC";c.lineWidth=2;c.globalAlpha=chP*.5;
      c.beginPath();c.arc(bodyX,cy,R+3+chP*5,0,TAU*chP);c.stroke();
      c.restore();
    }else{ // 射擊
      const sp=(p-.6)/.4;
      recoil=sp<.3?(sp/.3)*1.5:Math.max(0,1.5*(1-(sp-.3)/.7));
      // 大火花
      if(sp<.4){
        c.save();c.globalAlpha=(1-sp/.4)*.9;
        c.fillStyle="#FFD43B";c.beginPath();c.arc(mzX+f*8,mzY,8+sp*15,0,TAU);c.fill();
        c.fillStyle="#fff";c.beginPath();c.arc(mzX+f*5,mzY,4,0,TAU);c.fill();
        c.restore();
      }
      // 穿透光束
      if(sp<.6){
        c.save();c.globalAlpha=(1-sp/.6)*.7;c.strokeStyle="#74C0FC";c.lineWidth=3*(1-sp/.6);
        c.shadowColor="#74C0FC";c.shadowBlur=8;
        c.beginPath();c.moveTo(mzX,mzY);c.lineTo(mzX+f*150,mzY);c.stroke();
        c.shadowBlur=0;c.restore();
      }
      if(sp<.1)spawnBullets(buls,mzX,mzY,f,1,0);
    }
  }
  else if(act>0&&style===3){ // D. 彈幕掃射
    const sp=p;
    recoil=sp<.3?sp/.3*.8:Math.max(0,.8*(1-(sp-.3)/.7));
    // 扇形火花
    if(sp<.4){
      const fp=sp/.4;
      for(let i=0;i<5;i++){
        const a=(f>0?-.3:.3-PI)+i*.15;
        const d=10+fp*25;
        c.save();c.globalAlpha=(1-fp)*.7;c.fillStyle=i%2?"#FFE066":"#74C0FC";
        c.beginPath();c.arc(mzX+Math.cos(a)*d,mzY+Math.sin(a)*d,2,0,TAU);c.fill();c.restore();
      }
    }
    // 大槍口閃光
    if(sp<.2){
      c.save();c.globalAlpha=(1-sp/.2)*.6;c.fillStyle="#FFE066";
      c.beginPath();c.arc(mzX+f*6,mzY,6+sp*20,0,TAU);c.fill();c.restore();
    }
    if(sp<.08)spawnBullets(buls,mzX,mzY,f,5,.12);
  }

  // draw gun
  c.save();
  c.translate(bodyX+f*R*.45,cy+R*.05);
  c.rotate(Math.sin(time*5)*.025);
  c.scale(.11*f,.11);
  drawGun(c,ELEM,time,recoil);
  c.restore();

  // idle muzzle glow
  if(act===0){
    const mg=.3+Math.sin(time*8)*.15;
    c.save();c.fillStyle="#74C0FC";c.globalAlpha=mg;
    c.beginPath();c.arc(mzX,mzY,2,0,TAU);c.fill();
    c.globalAlpha=mg*.3;c.beginPath();c.arc(mzX,mzY,4,0,TAU);c.fill();
    c.restore();
  }

  // draw bullets
  for(let i=buls.length-1;i>=0;i--){
    const b=buls[i];
    b.x+=b.vx;b.y+=b.vy;b.life-=.03;
    if(b.life<=0){buls.splice(i,1);continue;}
    c.save();c.globalAlpha=b.life;c.fillStyle="#FFE066";c.shadowColor="#74C0FC";c.shadowBlur=4;
    c.beginPath();c.arc(b.x,b.y,2.5,0,TAU);c.fill();
    // trail
    c.globalAlpha=b.life*.3;c.fillStyle="#74C0FC";
    c.beginPath();c.arc(b.x-b.vx*.5,b.y-b.vy*.5,1.5,0,TAU);c.fill();
    c.shadowBlur=0;c.restore();
  }

  // element particles
  for(let i=0;i<3;i++){
    const a=time*2+i*TAU/3;
    const dist=24+Math.sin(time*2+i*2)*4;
    c.save();c.globalAlpha=.15+Math.sin(time*3+i)*.08;
    c.fillStyle="#74C0FC";c.shadowColor="#74C0FC";c.shadowBlur=4;
    c.beginPath();c.arc(bodyX+Math.cos(a)*dist,cy+Math.sin(a)*dist,1.2,0,TAU);c.fill();
    c.shadowBlur=0;c.restore();
  }

  c.restore();
}

function frame(){
  t+=1/60;

  cx1.clearRect(0,0,W,H);
  if(act1>0){actT1+=1/60;if(actT1>.6){act1=0;actT1=0;}}
  drawGunner(cx1,W/2,H/2,t,1,act1,actT1,bullets1);

  cx2.clearRect(0,0,W,H);
  autoTimer+=1/60;
  if(autoTimer>1){autoTimer=0;act2=1;actT2=0;}
  if(act2>0){actT2+=1/60;if(actT2>.6){act2=0;actT2=0;}}
  drawGunner(cx2,W/2,H/2,t,-1,act2,actT2,bullets2);

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
